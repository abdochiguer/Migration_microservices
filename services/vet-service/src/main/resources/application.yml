server:
  port: 8080

spring:
  application:
    name: vet-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vetdb}}
    username: ${POSTGRES_USER:vetuser}
    password: ${POSTGRES_PASS:vetpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

---
# Profil pour les tests ou le mode local mémoire H2
spring:
  config:
    activate:
      on-profile: test,local-h2
  datasource:
    url: jdbc:h2:mem:vetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

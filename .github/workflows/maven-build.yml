name: Petclinic CI (Java 21 + Docker Compose)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build-and-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Test and package with Maven
        run: ./mvnw -B verify
      - name: Build and start Petclinic
        run: docker compose up --build -d petclinic
      - name: Smoke test
        run: curl --fail --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8080/
      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

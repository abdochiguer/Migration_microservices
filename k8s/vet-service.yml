---
apiVersion: v1
kind: Secret
metadata:
  name: vet-db
  namespace: microservices
type: Opaque
stringData:
  database: "vetdb"
  username: "vetuser"
  password: "vetpass"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vet-db-init
  namespace: microservices
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS vets (
      id         INT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      first_name TEXT,
      last_name  TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_vets_last_name ON vets (last_name);

    CREATE TABLE IF NOT EXISTS specialties (
      id   INT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      name TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_specialties_name ON specialties (name);

    CREATE TABLE IF NOT EXISTS vet_specialties (
      vet_id       INT NOT NULL REFERENCES vets (id),
      specialty_id INT NOT NULL REFERENCES specialties (id),
      UNIQUE (vet_id, specialty_id)
    );


---
apiVersion: v1
kind: Service
metadata:
  name: vet-db
  namespace: microservices
spec:
  ports:
    - port: 5432
  selector:
    app: vet-db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vet-db
  namespace: microservices
  labels:
    app: vet-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vet-db
  template:
    metadata:
      labels:
        app: vet-db
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: password
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: vet-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init-scripts
          configMap:
            name: vet-db-init
        - name: vet-db-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: vet-service
  namespace: microservices
  labels:
    app: vet-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: vet-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vet-service
  namespace: microservices
  labels:
    app: vet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vet-service
  template:
    metadata:
      labels:
        app: vet-service
    spec:
      containers:
        - name: vet-service
          image: vet-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POSTGRES_URL
              value: jdbc:postgresql://vet-db.microservices.svc.cluster.local:5432/vetdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: username
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

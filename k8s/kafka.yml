apiVersion: v1
kind: Namespace
metadata:
  name: kafka

---
# =============================================================================
# Kafka (mode KRaft, 1 nœud, sans Zookeeper)
# =============================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: pool
  namespace: kafka
  labels:
    strimzi.io/cluster: petclinic-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m
  jvmOptions:
    -Xms: 256m
    -Xmx: 384m

---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: petclinic-kafka
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
    userOperator:
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi

---
# =============================================================================
# KafkaConnect avec le plugin Debezium PostgreSQL (construit automatiquement)
# =============================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: debezium-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"   # Active les KafkaConnector CRDs
spec:
  replicas: 1
  bootstrapServers: petclinic-kafka-kafka-bootstrap:9092
  build:
    output:
      type: docker
      image: localhost:5000/debezium-connect:latest
    plugins:
      - name: debezium-postgres
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/2.5.4.Final/debezium-connector-postgres-2.5.4.Final-plugin.tar.gz
  config:
    group.id: debezium-cluster
    offset.storage.topic: debezium-offsets
    config.storage.topic: debezium-configs
    status.storage.topic: debezium-statuses
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m

---
# =============================================================================
# Connecteur CDC Debezium (déclaratif ! Plus besoin de Job curl)
# =============================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: petclinic-postgres-source
  namespace: kafka
  labels:
    strimzi.io/cluster: debezium-connect   # Lie ce connecteur au KafkaConnect ci-dessus
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: demo-db.default.svc.cluster.local
    database.port: 5432
    database.user: user
    database.password: pass
    database.dbname: petclinic
    topic.prefix: petclinic
    table.include.list: "public.vets,public.specialties,public.vet_specialties"
    plugin.name: pgoutput
    slot.name: debezium_petclinic
    publication.name: debezium_pub
    publication.autocreate.mode: filtered
    snapshot.mode: initial
